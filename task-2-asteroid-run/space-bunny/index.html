<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>VOID RUNNER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 L25 29 L16 22 L7 29 Z' fill='%2366f9ff'/%3E%3C/svg%3E">
<style>
  :root{
    --cy:#6ff6ff; --mg:#ff5fd2; --am:#ffc75f; --dim:rgba(111,246,255,.42);
    --panel:rgba(6,14,26,.72);
    --font:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#03060d;color:#dff7ff;font-family:var(--font)}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none;z-index:10}
  #ui::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 4px);
    mix-blend-mode:multiply;
  }
  .hidden{display:none!important}
  .glow{text-shadow:0 0 6px rgba(111,246,255,.65),0 0 22px rgba(111,246,255,.28)}

  #top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
       align-items:flex-start;padding:18px 22px;gap:16px}
  .stat{display:flex;align-items:baseline;gap:9px;line-height:1}
  .stat .k{font-size:10px;letter-spacing:.24em;color:var(--dim)}
  .stat .v{font-size:26px;font-weight:700;color:var(--cy);text-shadow:0 0 10px rgba(111,246,255,.55)}
  .stat.big .v{font-size:40px}
  .stat.right{justify-content:flex-end}
  #best.v{color:var(--am);text-shadow:0 0 10px rgba(255,199,95,.45)}
  #wave.v{color:var(--mg);text-shadow:0 0 10px rgba(255,95,210,.45)}
  #lives{display:flex;gap:7px;margin-top:12px;justify-content:flex-end}
  #lives svg{width:20px;height:20px;color:var(--cy);filter:drop-shadow(0 0 5px rgba(111,246,255,.65))}
  #lives svg path{fill:currentColor}

  #badge{position:absolute;top:22px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:.34em;color:var(--am);padding:6px 16px;
    border:1px solid rgba(255,199,95,.38);border-radius:2px;background:var(--panel);
    text-shadow:0 0 10px rgba(255,199,95,.6);animation:pulse 2.4s ease-in-out infinite}
  #badge.demo{color:var(--mg);border-color:rgba(255,95,210,.4);text-shadow:0 0 10px rgba(255,95,210,.6)}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  #banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center}
  #banner .t{font-size:min(7vw,58px);font-weight:800;letter-spacing:.14em;color:#eafcff;
    text-shadow:0 0 18px rgba(111,246,255,.75),0 0 60px rgba(255,95,210,.4)}
  #banner .s{margin-top:12px;font-size:12px;letter-spacing:.3em;color:var(--dim)}
  #banner .s b{color:var(--cy);font-weight:700}

  #gameover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:radial-gradient(ellipse at center,rgba(4,10,20,.55),rgba(2,4,10,.9));
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .45s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #gameover h1{font-size:min(9vw,76px);font-weight:800;letter-spacing:.2em;color:#fff;
    text-shadow:0 0 20px rgba(255,95,210,.9),0 0 70px rgba(255,60,170,.5)}
  #gameover .rows{display:flex;gap:44px;margin:6px 0 10px}
  #gameover .rows div{display:flex;flex-direction:column;align-items:center;gap:7px}
  #gameover .rows .k{font-size:10px;letter-spacing:.26em;color:var(--dim)}
  #gameover .rows .v{font-size:34px;font-weight:700;color:var(--cy);text-shadow:0 0 12px rgba(111,246,255,.55)}
  #gameover .rows div:last-child .v{color:var(--am);text-shadow:0 0 12px rgba(255,199,95,.5)}
  .key{display:inline-block;border:1px solid var(--dim);border-radius:3px;padding:1px 7px;color:var(--cy);
    font-weight:700;text-shadow:0 0 8px rgba(111,246,255,.5)}
  #gameover .hint{font-size:12px;letter-spacing:.22em;color:var(--dim)}
  #gameover .hint.dim2{font-size:10px;opacity:.55;margin-top:6px}

  #sound{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);pointer-events:auto;cursor:pointer;
    font-size:11px;letter-spacing:.18em;color:var(--am);padding:8px 16px;border-radius:2px;
    border:1px solid rgba(255,199,95,.32);background:var(--panel);text-shadow:0 0 8px rgba(255,199,95,.5);
    animation:pulse 2.4s ease-in-out infinite}
  #sound:hover{background:rgba(12,26,44,.9)}

  #legend{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);white-space:nowrap;
    font-size:11px;letter-spacing:.12em;color:var(--dim);transition:opacity .8s ease-out}
  #legend b{color:var(--cy);font-weight:700}
  #legend.dim{opacity:.18}

  #fatal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;background:#03060d;padding:32px;text-align:center}
  #fatal h2{color:var(--mg);letter-spacing:.2em}
  #fatal p{color:var(--dim);font-size:12px;letter-spacing:.1em;max-width:520px;line-height:1.7}
  #fatal code{color:var(--cy)}
  @media (max-width:720px){
    #legend{font-size:9px;letter-spacing:.06em}
    #top{padding:12px 14px}
    .stat .v{font-size:22px}.stat.big .v{font-size:30px}
  }
</style>
</head>
<body>
<div id="ui">
  <div id="top">
    <div>
      <div class="stat big"><span class="k">SCORE</span><span class="v glow" id="score">0</span></div>
      <div class="stat"><span class="k">BEST</span><span class="v" id="best">0</span></div>
    </div>
    <div>
      <div class="stat right"><span class="k">WAVE</span><span class="v" id="wave">1</span></div>
      <div id="lives"></div>
    </div>
  </div>
  <div id="badge" class="hidden">AI AUTOPILOT</div>
  <div id="banner" class="hidden"></div>
  <div id="gameover" class="hidden">
    <h1>GAME OVER</h1>
    <div class="rows">
      <div><span class="k">SCORE</span><span class="v" id="goScore">0</span></div>
      <div><span class="k">BEST</span><span class="v" id="goBest">0</span></div>
      <div><span class="k">WAVE</span><span class="v" id="goWave">1</span></div>
    </div>
    <div class="hint">PRESS <span class="key">R</span> OR CLICK TO RESTART</div>
    <div class="hint dim2">IDLE 12s &rarr; DEMO MODE</div>
  </div>
  <div id="sound" class="hidden">CLICK OR PRESS ANY KEY TO ENABLE SOUND</div>
  <div id="legend"><b>W/&uarr;</b> THRUST &nbsp; <b>A D / &larr; &rarr;</b> TURN &nbsp; <b>S/&darr;</b> REVERSE &nbsp; <b>SPACE</b> FIRE &nbsp; <b>P</b> PAUSE &nbsp; <b>M</b> MUTE</div>
  <div id="fatal" class="hidden">
    <h2>UNABLE TO START</h2>
    <p id="fatalMsg"></p>
  </div>
</div>

<script>
(function(){
  var CDN = [
    'https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js',
    'https://unpkg.com/three@0.159.0/build/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.159.0/three.min.js'
  ];
  var idx = 0;
  window.__loadThree = function(){
    if(idx >= CDN.length) return false;
    var s = document.createElement('script');
    s.src = CDN[idx++];
    s.onload = function(){ if(window.THREE) { window.__bootGame(); return; } window.__loadThree(); };
    s.onerror = function(){ window.__loadThree(); };
    document.head.appendChild(s);
    return true;
  };
  window.__fatal = function(msg){
    var f = document.getElementById('fatal');
    document.getElementById('fatalMsg').innerHTML = msg;
    f.classList.remove('hidden');
  };
  window.__loadThree();
})();
</script>

<script>
window.__bootGame = function(){
'use strict';

var TAU = Math.PI * 2;
var FIELD_X = 22, FIELD_Y = 14;
var SHIP_R = 0.8;
var AST_R = [2.45, 1.40, 0.80];
var AST_SCORE = [20, 50, 100];
var AST_HP = [4, 2, 1];
var START_LIVES = 3;
var IDLE_MS = 3000;
var DEMO_RETURN_MS = 12000;
var BULLET_MAX = 18;
var BULLET_SPEED = 44;
var BULLET_LIFE = 1.30;
var FIRE_CD = 0.155;
var SHIP_ACCEL = 40;
var SHIP_MAXV = 21;
var SHIP_TURN = 4.3;
var SHIP_REVERSE = 0.55;
var SHIP_DRAG = 0.55;
var PMAX = 4200;
var STEP = 1 / 120;

function rnd(a, b){ return a + Math.random() * (b - a); }
function rndInt(a, b){ return Math.floor(rnd(a, b + 1)); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function pick(arr){ return arr[(Math.random() * arr.length) | 0]; }
function wrapAngle(a){ a = (a + Math.PI) % TAU; if(a < 0) a += TAU; return a - Math.PI; }
function wrapPos(v, half){ var s = half * 2; if(v > half) v -= s; else if(v < -half) v += s; return v; }
function wrapDelta(d, half){ var s = half * 2; if(d > half) d -= s; else if(d < -half) d += s; return d; }
function dist2(x, y, ax, ay, fx, fy){
  var dx = wrapDelta(ax - x, fx), dy = wrapDelta(ay - y, fy);
  return dx * dx + dy * dy;
}
function nowMs(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }

var $ = function(id){ return document.getElementById(id); };
var elScore = $('score'), elBest = $('best'), elWave = $('wave'), elLives = $('lives');
var elBadge = $('badge'), elBanner = $('banner'), elOver = $('gameover'), elSound = $('sound'), elLegend = $('legend');

var best = 0;
try { best = parseInt(localStorage.getItem('voidrunner.best') || '0', 10) || 0; } catch (e) { best = 0; }
function saveBest(){ try { localStorage.setItem('voidrunner.best', String(best)); } catch (e) {} }

/* ---------------------------------------------------------------- sound */
var Sound = {
  ctx: null, master: null, noiseBuf: null, ready: false, muted: false,
  thrGain: null, padGain: null, padOscs: [],

  init: function(){
    if (this.ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    var ctx = this.ctx;
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 24; comp.ratio.value = 9;
    comp.attack.value = 0.004; comp.release.value = 0.22;
    this.master = ctx.createGain();
    this.master.gain.value = 0.85;
    this.master.connect(comp);
    comp.connect(ctx.destination);

    var len = ctx.sampleRate * 2;
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0), last = 0;
    for (var i = 0; i < len; i++){
      var w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = last * 3.2;
    }
    this.noiseBuf = buf;

    var src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = 0.9;
    var g = ctx.createGain(); g.gain.value = 0;
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(0);
    this.thrGain = g;

    var pad = ctx.createGain(); pad.gain.value = 0;
    pad.connect(this.master);
    this.padGain = pad;
    var freqs = [55, 82.4, 110, 164.8];
    for (var k = 0; k < freqs.length; k++){
      var o = ctx.createOscillator();
      o.type = k % 2 ? 'sine' : 'triangle';
      o.frequency.value = freqs[k];
      o.detune.value = (Math.random() * 2 - 1) * 9;
      var og = ctx.createGain(); og.gain.value = 0.11 / (k + 1);
      var lfo = ctx.createOscillator();
      lfo.type = 'sine'; lfo.frequency.value = 0.05 + k * 0.037;
      var lg = ctx.createGain(); lg.gain.value = 1.6 + k * 0.6;
      lfo.connect(lg); lg.connect(o.detune);
      o.connect(og); og.connect(pad);
      o.start(0); lfo.start(0);
      this.padOscs.push(o, lfo);
    }
  },

  unlock: function(){
    this.init();
    if (!this.ctx) return;
    var self = this;
    var resume = function(){
      if (self.ctx.state !== 'running'){ try { self.ctx.resume(); } catch (e) {} }
      if (self.ctx.state === 'running'){
        self.ready = true;
        elSound.classList.add('hidden');
      }
    };
    resume();
    if (!this._listeners){
      this._listeners = true;
      document.addEventListener('pointerdown', resume, { passive: true });
      document.addEventListener('keydown', resume);
      document.addEventListener('touchstart', resume, { passive: true });
    }
  },

  ok: function(){ return this.ready && this.ctx && !this.muted; },
  t: function(){ return this.ctx.currentTime; },

  env: function(node, t, peak, atk, dec){
    var g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + atk + dec);
    node.connect(g); g.connect(this.master);
    return g;
  },

  laser: function(){
    if (!this.ok()) return;
    var ctx = this.ctx, t = this.t();
    var o = ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(rnd(880, 960), t);
    o.frequency.exponentialRampToValueAtTime(150, t + 0.17);
    var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 6;
    f.frequency.setValueAtTime(4600, t);
    f.frequency.exponentialRampToValueAtTime(700, t + 0.18);
    o.connect(f);
    this.env(f, t, 0.30, 0.006, 0.19);
    o.start(t); o.stop(t + 0.22);

    var n = ctx.createBufferSource(); n.buffer = this.noiseBuf; n.loop = true;
    var nf = ctx.createBiquadFilter(); nf.type = 'highpass'; nf.frequency.value = 2200;
    n.connect(nf);
    this.env(nf, t, 0.10, 0.004, 0.06);
    n.start(t); n.stop(t + 0.09);
  },

  boom: function(size, big){
    if (!this.ok()) return;
    var ctx = this.ctx, t = this.t();
    var dur = big ? 1.15 : 0.30 + size * 0.09;
    var n = ctx.createBufferSource(); n.buffer = this.noiseBuf; n.loop = true;
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = big ? 0.8 : 1.5;
    var top = big ? 520 : 1750 - size * 260;
    bp.frequency.setValueAtTime(top, t);
    bp.frequency.exponentialRampToValueAtTime(big ? 70 : 230, t + dur);
    n.connect(bp);
    this.env(bp, t, big ? 0.55 : 0.20 + size * 0.03, 0.008, dur);
    n.start(t); n.stop(t + dur + 0.05);

    var o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(big ? 160 : 120 - size * 18, t);
    o.frequency.exponentialRampToValueAtTime(big ? 26 : 52, t + dur * 0.8);
    this.env(o, t, big ? 0.5 : 0.16, 0.01, dur * 0.8);
    o.start(t); o.stop(t + dur);
  },

  die: function(){
    if (!this.ok()) return;
    var ctx = this.ctx, t = this.t(), self = this;
    var n = ctx.createBufferSource(); n.buffer = this.noiseBuf; n.loop = true;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(3200, t);
    lp.frequency.exponentialRampToValueAtTime(120, t + 1.5);
    n.connect(lp);
    this.env(lp, t, 0.6, 0.01, 1.5);
    n.start(t); n.stop(t + 1.6);

    var o = ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(420, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 1.4);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.34, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.45);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 1.5);
  },

  thrust: function(v){
    if (!this.thrGain || !this.ctx) return;
    var target = this.muted ? 0 : v * 0.14;
    try { this.thrGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.07); } catch (e) {}
  },

  blip: function(freq, dur, type, vol){
    if (!this.ok()) return;
    var ctx = this.ctx, t = this.t();
    var o = ctx.createOscillator();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    this.env(o, t, vol || 0.16, 0.005, dur || 0.1);
    o.start(t); o.stop(t + (dur || 0.1) + 0.05);
  },

  chord: function(freqs, dur, type, vol){
    if (!this.ok()) return;
    for (var i = 0; i < freqs.length; i++){
      var ctx = this.ctx, t = this.t() + i * dur * 0.62;
      var o = ctx.createOscillator(); o.type = type || 'triangle';
      o.frequency.setValueAtTime(freqs[i], t);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.20, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.05);
    }
  },

  over: function(){
    if (!this.ok()) return;
    this.chord([440, 349.2, 261.6, 174.6], 0.5, 'sawtooth', 0.19);
    this.boom(0, true);
  },

  start: function(){ if (this.ok()) this.chord([261.6, 392, 523.3], 0.26, 'triangle', 0.17); },
  pickup: function(){ if (this.ok()) this.chord([659.3, 987.8, 1318.5], 0.14, 'sine', 0.15); },

  pad: function(on){
    if (!this.padGain || !this.ctx) return;
    try {
      this.padGain.gain.cancelScheduledValues(this.ctx.currentTime);
      this.padGain.gain.setTargetAtTime(on && !this.muted ? 0.32 : 0, this.ctx.currentTime, on ? 1.2 : 0.4);
    } catch (e) {}
  },

  toggleMute: function(){
    this.muted = !this.muted;
    if (this.master) {
      try { this.master.gain.setTargetAtTime(this.muted ? 0 : 0.85, this.ctx.currentTime, 0.03); } catch (e) {}
    }
    return this.muted;
  },

  suspend: function(){ if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); },
  resume: function(){ if (this.ctx && this.ctx.state === 'suspended' && this.ready) this.ctx.resume(); }
};

/* ---------------------------------------------------------------- three */
var renderer, scene, camera;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  window.__fatal('WebGL could not be initialised in this browser.<br>Enable hardware acceleration or try a different browser.');
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x03060d, 1);
document.body.appendChild(renderer.domElement);

scene = new THREE.Scene();
camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 900);

function fitCamera(){
  var aspect = window.innerWidth / window.innerHeight;
  var vf = 55 * Math.PI / 180;
  var needH = (FIELD_Y + 1.5) / Math.tan(vf / 2);
  var needW = (FIELD_X + 1.5) / (Math.tan(vf / 2) * aspect);
  var dist = Math.max(needH, needW);
  camera.aspect = aspect;
  camera.position.set(0, FIELD_Y * 0.62, dist);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
  baseCamZ = dist;
}
var baseCamZ = 40;

var skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {},
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: [
    'varying vec3 vP;',
    'float h(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,45.164)))*43758.5453); }',
    'void main(){',
    '  vec3 d = normalize(vP);',
    '  float t = d.y*0.5+0.5;',
    '  vec3 c = mix(vec3(0.008,0.014,0.042), vec3(0.045,0.016,0.086), smoothstep(0.0,1.0,t));',
    '  c = mix(c, vec3(0.012,0.055,0.082), smoothstep(0.55,0.0,abs(d.y))*0.85);',
    '  float band = sin(d.x*7.0+d.y*4.0+sin(d.z*5.0)*1.6)*0.5+0.5;',
    '  c += vec3(0.028,0.006,0.042)*pow(band,3.0);',
    '  float n = h(floor(d*140.0));',
    '  c += vec3(step(0.9985,n))*0.55;',
    '  gl_FragColor = vec4(c,1.0);',
    '}'
  ].join('\n')
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(420, 32, 24), skyMat));

function starSprite(){
  var c = document.createElement('canvas');
  c.width = c.height = 64;
  var g = c.getContext('2d');
  var grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0.00, 'rgba(255,255,255,1)');
  grd.addColorStop(0.18, 'rgba(255,255,255,0.92)');
  grd.addColorStop(0.42, 'rgba(255,255,255,0.34)');
  grd.addColorStop(0.72, 'rgba(255,255,255,0.07)');
  grd.addColorStop(1.00, 'rgba(255,255,255,0)');

/* ---------------------------------------------------------------- materials */
function rimMaterial(base, rim, power, bright){
  return new THREE.ShaderMaterial({
    uniforms: {
      uBase: { value: new THREE.Color(base) },
      uRim: { value: new THREE.Color(rim) },
      uPow: { value: power || 2.4 },
      uBright: { value: bright === undefined ? 1.15 : bright }
    },
    vertexShader: 'varying vec3 vN; varying vec3 vV;' +
      'void main(){ vN = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.0);' +
      ' vV = -mv.xyz; gl_Position = projectionMatrix*mv; }',
    fragmentShader: 'uniform vec3 uBase; uniform vec3 uRim; uniform float uPow; uniform float uBright;' +
      'varying vec3 vN; varying vec3 vV;' +
      'void main(){ float f = 1.0 - max(dot(normalize(vN), normalize(vV)), 0.0);' +
      ' float rim = pow(f, uPow);' +
      ' float lam = 0.55 + 0.45*max(dot(normalize(vN), normalize(vec3(0.35,0.75,0.62))), 0.0);' +
      ' vec3 c = uBase*lam + uRim*rim*uBright;' +
      ' gl_FragColor = vec4(c,1.0); }'
  });
}

var astPalette = [
  { solid: 0x0e2338, rim: 0x49d8ff },

  { solid: 0x2c2410, rim: 0xffc75f }
];

function hash3(x, y, z, s){
  var v = Math.sin(x * 12.9898 + y * 78.233 + z * 45.164 + s * 7.13) * 43758.5453;
  return v - Math.floor(v);
}

function makeAsteroidGeo(radius, seed, detail){
  var geo = new THREE.IcosahedronGeometry(radius, detail);
  var p = geo.attributes.position;
  var v = new THREE.Vector3();
  var seen = {};
  for (var i = 0; i < p.count; i++){
    v.fromBufferAttribute(p, i);
    var key = Math.round(v.x * 7) + '_' + Math.round(v.y * 7) + '_' + Math.round(v.z * 7);
    if (seen[key] === undefined){
      seen[key] = 0.72 + hash3(v.x, v.y, v.z, seed) * 0.52;
    }
    var k = seen[key];
    v.multiplyScalar(k);
    v.x *= 1 + (hash3(v.y, v.z, v.x, seed + 3) - 0.5) * 0.22;
    v.z *= 1 + (hash3(v.z, v.x, v.y, seed + 9) - 0.5) * 0.22;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

var astGeo = [], astEdge = [], astPools = [[], [], []];
for (var s = 0; s < 3; s++){
  astGeo[s] = makeAsteroidGeo(AST_R[s], s * 17 + 3, s === 0 ? 1 : 0);
  astEdge[s] = new THREE.EdgesGeometry(astGeo[s], 12);
  for (var k = 0; k < 10; k++) astPools[s].push(null);
}
function acquireAsteroid(size){
  var pool = astPools[size];
  for (var i = 0; i < pool.length; i++){
    if (pool[i] !== null){
      var m = pool[i];
      pool[i] = null;
      m.visible = true;
      return m;
    }
  }
  var grp = new THREE.Group();
  var solid = new THREE.Mesh(astGeo[size], rimMaterial(astPalette[size].solid, astPalette[size].rim, 2.2, 1.25));
  var edges = new THREE.LineSegments(astEdge[size], new THREE.LineBasicMaterial({
    color: astPalette[size].rim, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  edges.scale.setScalar(1.004);
  grp.add(solid); grp.add(edges);
  grp.userData.solid = solid;
  scene.add(grp);
  return grp;
}
function releaseAsteroid(mesh){
  for (var s = 0; s < 3; s++){
    var pool = astPools[s];
    for (var i = 0; i < pool.length; i++){
      if (pool[i] === null){ mesh.visible = false; pool[i] = mesh; return; }
    }
  }
  mesh.visible = false;
}

var pPos = new Float32Array(PMAX * 3);
var pCol = new Float32Array(PMAX * 3);
var pSize = new Float32Array(PMAX);
var pAlpha = new Float32Array(PMAX);
var pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('aColor', new THREE.BufferAttribute(pCol, 3));
pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1));
pGeo.setAttribute('aAlpha', new THREE.BufferAttribute(pAlpha, 1));
pGeo.setDrawRange(0, 0);
var pMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: [
    'attribute vec3 aColor; attribute float aSize; attribute float aAlpha;',
    'varying vec3 vC; varying float vA;',
    'void main(){ vC = aColor; vA = aAlpha;',
    ' vec4 mv = modelViewMatrix * vec4(position,1.0);',
    ' gl_PointSize = aSize * (300.0 / max(0.001,-mv.z));',
    ' gl_Position = projectionMatrix * mv; }'
  ].join('\n'),
  fragmentShader: [
    'varying vec3 vC; varying float vA;',
    'void main(){ vec2 uv = gl_PointCoord - vec2(0.5);',
    ' float d = length(uv); if(d > 0.5) discard;',
    ' float a = smoothstep(0.5, 0.02, d);',

  ].join('\n')
});

var pLive = [], pFree = [];
for (var pi = 0; pi < PMAX; pi++) pFree.push({ x:0, y:0, z:0, vx:0, vy:0, vz:0, life:0, max:1, size:1, r:1, g:1, b:1, drag:1, spin:0 });

function spawnPart(o){
  if (!pFree.length) return;
  var p = pFree.pop();
  p.x = o.x; p.y = o.y; p.z = o.z || 0;
  p.vx = o.vx; p.vy = o.vy; p.vz = o.vz || 0;
  p.life = o.life; p.max = o.life;
  p.size = o.size; p.r = o.r; p.g = o.g; p.b = o.b;
  p.drag = o.drag === undefined ? 1.6 : o.drag;
  p.spin = o.spin || 0;
  pLive.push(p);
}

var tmpColor = new THREE.Color();
function burst(x, y, count, colorA, colorB, speed, life, size, zJit){
  tmpColor.set(colorA);
  for (var i = 0; i < count; i++){
    if (colorB !== undefined && Math.random() < 0.5) tmpColor.set(colorB);
    var a = rnd(0, TAU), sp = rnd(speed * 0.25, speed);
    spawnPart({
      x: x + rnd(-0.25, 0.25), y: y + rnd(-0.25, 0.25), z: rnd(-(zJit || 0.35), (zJit || 0.35)),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: rnd(-1.2, 1.2),
      life: life * rnd(0.55, 1.25),
      size: size * rnd(0.5, 1.5),
      r: tmpColor.r, g: tmpColor.g, b: tmpColor.b,
      drag: rnd(1.1, 2.4)
    });
    if (pLive.length > PMAX * 0.92) break;
  }
}

function updateParticles(dt){
  for (var i = pLive.length - 1; i >= 0; i--){
    var p = pLive[i];
    p.life -= dt;
    if (p.life <= 0){
      pFree.push(p);
      pLive[i] = pLive[pLive.length - 1];
      pLive.pop();
      continue;
    }
    var d = Math.exp(-p.drag * dt);
    p.vx *= d; p.vy *= d; p.vz *= d;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.z > 2) { p.z = 2; p.vz *= -0.4; }
    if (p.z < -2) { p.z = -2; p.vz *= -0.4; }
  }
  var n = pLive.length;
  for (var j = 0; j < n; j++){
    var q = pLive[j];
    var t = q.life / q.max;
    pPos[j * 3] = q.x; pPos[j * 3 + 1] = q.y; pPos[j * 3 + 2] = q.z;
    pCol[j * 3] = q.r; pCol[j * 3 + 1] = q.g; pCol[j * 3 + 2] = q.b;
    pSize[j] = q.size * (0.35 + t * 0.75);
    pAlpha[j] = t < 0.25 ? t / 0.25 : Math.min(1, (1 - t) * 3.2);
    if (pAlpha[j] > 1) pAlpha[j] = 1;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.aColor.needsUpdate = true;
  pGeo.attributes.aSize.needsUpdate = true;
  pGeo.attributes.aAlpha.needsUpdate = true;
  pGeo.setDrawRange(0, n);
}

function updateRings(dt){
  for (var i = 0; i < rings.length; i++){

    if (r.t <= 0) continue;
    r.t -= dt;
    var k = 1 - r.t / r.dur;

    r.mesh.material.opacity = (1 - k) * (1 - k) * 0.62;

var S = { ATTRACT: 'attract', PLAYING: 'playing', RESPAWN: 'respawn', OVER: 'over', PAUSED: 'paused' };
var state = S.ATTRACT;
var prevState = S.ATTRACT;
var stateBeforeDeath = S.PLAYING;
var respawnTo = S.PLAYING;
var score = 0, lives = START_LIVES, wave = 1, waveTimer = 0;
var lastHuman = -1e9;
var autopilot = true;
var bannerT = 0;
var respawnT = 0;

var shake = 0;
var aiT = 0;
var aiOut = { left: false, right: false, thrust: false, fire: false };

var asteroids = [];

function speedMul(){ return Math.min(2.1, 1 + (wave - 1) * 0.085); }

function spawnAsteroid(size, x, y, vx, vy){
  var mesh = acquireAsteroid(size);
  var ax = x === undefined ? rnd(-FIELD_X, FIELD_X) : x;
  var ay = y === undefined ? rnd(-FIELD_Y, FIELD_Y) : y;
  var a = rnd(0, TAU), sp = rnd(1.5, 3.4) * speedMul() * (1 - size * 0.16);
  var o = {
    size: size, r: AST_R[size] * 0.94, hp: AST_HP[size],
    x: ax, y: ay,
    vx: vx === undefined ? Math.cos(a) * sp : vx,
    vy: vy === undefined ? Math.sin(a) * sp : vy,
    rx: rnd(-1, 1), ry: rnd(-1, 1), rz: rnd(-1, 1),
    spin: rnd(0.25, 1.0) * (Math.random() < 0.5 ? -1 : 1),
    mesh: mesh
  };
  var rl = Math.sqrt(o.rx * o.rx + o.ry * o.ry + o.rz * o.rz) || 1;
  o.rx /= rl; o.ry /= rl; o.rz /= rl;
  mesh.position.set(ax, ay, 0);
  mesh.rotation.set(rnd(0, TAU), rnd(0, TAU), rnd(0, TAU));
  asteroids.push(o);
  return o;
}

function safeSpawnPoint(minDist){
  var bestPt = null, bestD = -1;
  for (var i = 0; i < 24; i++){
    var x = rnd(-FIELD_X + 2, FIELD_X - 2), y = rnd(-FIELD_Y + 2, FIELD_Y - 2);
    var md = 1e9;
    for (var j = 0; j < asteroids.length; j++){
      var a = asteroids[j];
      var dx = wrapDelta(a.x - x, FIELD_X), dy = wrapDelta(a.y - y, FIELD_Y);
      var d = Math.sqrt(dx * dx + dy * dy) - a.r;
      if (d < md) md = d;
    }
    if (md > bestD){ bestD = md; bestPt = [x, y]; }
    if (md > (minDist || 14)) return [x, y];
  }
  return bestPt || [0, FIELD_Y - 4];
}

function spawnWave(n){
  wave = n;
  var count = Math.min(16, 4 + Math.floor(n * 0.75));
  for (var i = 0; i < count; i++){
    var pt = safeSpawnPoint(13);
    var size = (i < Math.max(2, count - n)) ? 0 : (Math.random() < 0.45 ? 0 : 1);
    spawnAsteroid(size, pt[0], pt[1]);
  }
  elWave.textContent = n;
}

function resetRun(){
  for (var i = 0; i < asteroids.length; i++) releaseAsteroid(asteroids[i].mesh);
  asteroids.length = 0;
  for (var b = 0; b < bullets.length; b++){
    bullets[b].on = false;
    bullets[b].mesh.visible = false;
    bullets[b].life = 0;
  }
  for (var r = 0; r < rings.length; r++){ rings[r].t = 0; rings[r].mesh.visible = false; }
  for (var p = 0; p < pLive.length; p++) pFree.push(pLive[p]);
  pLive.length = 0;
  score = 0; lives = START_LIVES; wave = 1; shake = 0; waveTimer = 0;
  spawnWave(1);
  respawnShip(true);
  updateLives();
  elScore.textContent = '0';
}

function setBadge(){
  if (!autopilot){ elBadge.classList.add('hidden'); return; }
  elBadge.classList.remove('hidden');
  elBadge.classList.toggle('demo', state === S.ATTRACT);
  elBadge.textContent = state === S.ATTRACT ? '◆ DEMO — AI IS FLYING' : '◆ AI AUTOPILOT';
}

function setState(s){
  state = s;
  if (s === S.ATTRACT){
    resetRun();
    elOver.classList.add('hidden');
    elLegend.classList.remove('dim');
    showBanner('VOID RUNNER', 'DEMO MODE — PRESS <b>ANY KEY</b> TO FLY', 4.5);
    Sound.pad(true);
    autopilot = true;
  } else if (s === S.PLAYING){
    elOver.classList.add('hidden');
    elLegend.classList.add('dim');
    Sound.pad(false);
  } else if (s === S.RESPAWN){
    respawnTo = (stateBeforeDeath === S.ATTRACT) ? S.ATTRACT : S.PLAYING;
    elOver.classList.add('hidden');
    respawnT = 2.0;
  } else if (s === S.OVER){
    if (score > best) best = score;
    saveBest();
    $('goScore').textContent = score;
    $('goBest').textContent = best;
    $('goWave').textContent = wave;
    elBest.textContent = best;
    elOver.classList.remove('hidden');
    overT = 0;
    Sound.over();
    Sound.pad(false);
  }
  setBadge();
}

function leaveRespawn(){
  state = respawnTo;
  if (state === S.PLAYING) elLegend.classList.add('dim');
  Sound.pad(state === S.ATTRACT);
  setBadge();
}

function killShip(){
  if (!ship.alive || state === S.OVER) return;
  stateBeforeDeath = state;
  ship.alive = false;
  shipMesh.visible = false;
  shipMesh.userData.shield.visible = false;
  burst(ship.x, ship.y, 90, 0xffffff, 0x6ff6ff, 15, 1.5, 0.85, 1.2);
  burst(ship.x, ship.y, 40, 0xffb347, 0xff5fd2, 9, 1.9, 0.7, 1.6);
  shockwave(ship.x, ship.y, 2.6, 0x9ff4ff);
  shake = Math.max(shake, 1.5);
  Sound.die();
  Sound.thrust(0);
  if (stateBeforeDeath === S.ATTRACT){
    lives = START_LIVES;
    updateLives();
  } else {
    lives--;
    updateLives();
  }
  if (lives <= 0) setState(S.OVER);
  else setState(S.RESPAWN);
}

function hitAsteroid(a, byPlayer){
  a.hp--;
  burst(a.x, a.y, 10, 0xffffff, astPalette[a.size].rim, 6, 0.42, 0.4, 0.5);
  if (a.hp > 0) return;
  if (byPlayer) addScore(AST_SCORE[a.size]);
  burst(a.x, a.y, 26 + a.size * 12, astPalette[a.size].rim, 0xffffff, 7 + a.size * 2.4, 0.85, 0.5, 0.8);
  shockwave(a.x, a.y, a.size + 1, astPalette[a.size].rim);
  shake = Math.max(shake, 0.35 + a.size * 0.14);
  Sound.boom(a.size, false);
  releaseAsteroid(a.mesh);
  var idx = asteroids.indexOf(a);
  if (idx >= 0) asteroids.splice(idx, 1);
  if (a.size < 2){
    for (var i = 0; i < 2; i++){
      var ang = rnd(0, TAU);
      var sp = rnd(1.6, 3.6) * speedMul();
      spawnAsteroid(a.size + 1,
        wrapPos(a.x + Math.cos(ang) * a.r * 0.7, FIELD_X),
        wrapPos(a.y + Math.sin(ang) * a.r * 0.7, FIELD_Y),
        a.vx + Math.cos(ang) * sp,
        a.vy + Math.sin(ang) * sp);
    }
  }
}

function spawnBullet(){
  var b = null;
  for (var i = 0; i < bullets.length; i++){ if (!bullets[i].on){ b = bullets[i]; break; } }
  if (!b) return;
  var fx = Math.sin(ship.head), fy = Math.cos(ship.head);
  b.on = true;
  b.x = wrapPos(ship.x + fx * 1.15, FIELD_X);
  b.y = wrapPos(ship.y + fy * 1.15, FIELD_Y);
  b.vx = ship.vx * 0.35 + fx * BULLET_SPEED;
  b.vy = ship.vy * 0.35 + fy * BULLET_SPEED;
  b.life = BULLET_LIFE;
  b.mesh.visible = true;
  b.trail = 0;
  burst(b.x, b.y, 4, 0xcaf7ff, 0x6ff6ff, 3.2, 0.18, 0.34, 0.2);
  Sound.laser();
}

/* ---------------------------------------------------------------- input */
var pointer = { down: false, sx: 0, sy: 0, cx: 0, cy: 0, dx: 0, dy: 0 };

function humanInput(){
  var k = keys;
  var left = !!k.ArrowLeft || !!k.KeyA;
  var right = !!k.ArrowRight || !!k.KeyD;
  var up = !!k.ArrowUp || !!k.KeyW;
  var down = !!k.ArrowDown || !!k.KeyS;
  var fire = !!k.Space;
  if (pointer.down){
    var dx = pointer.cx - pointer.sx, dy = pointer.sy - pointer.cy;
    var mag = Math.hypot(dx, dy);
    if (mag > 14){
      var want = Math.atan2(dx, dy);
      var diff = wrapAngle(want - ship.head);
      if (diff > 0.10) right = true;
      if (diff < -0.10) left = true;
      up = mag > 42;
      down = false;
      fire = fire || mag > 42;
    }
  }
  return { left: left, right: right, thrust: up, reverse: down, fire: fire };
}

function onHumanAct(){
  lastHuman = nowMs();
  if (autopilot){
    autopilot = false;
    setBadge();
  }
  if (state === S.ATTRACT){
    setState(S.PLAYING);
    showBanner('YOU HAVE CONTROL', 'W THRUST &nbsp;·&nbsp; SPACE FIRE', 2.6);
    Sound.start();
  }
}

var CONTROLS = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'thrust', KeyW: 'thrust',
  ArrowDown: 'reverse', KeyS: 'reverse',
  Space: 'fire'
};

window.addEventListener('keydown', function(e){
  Sound.unlock();
  if (CONTROLS[e.code] || e.code === 'Space'){ e.preventDefault(); }
  if (CONTROLS[e.code]) keys[CONTROLS[e.code]] = true;
  if (e.code === 'Space') keys.fire = true;
  if (e.code === 'KeyR'){ onHumanAct(); restart(); }
  if (e.code === 'KeyM'){ Sound.toggleMute(); flashMute(); }
  if (e.code === 'KeyP'){ togglePause(); }
  onHumanAct();
}, { passive: false });

window.addEventListener('keyup', function(e){
  if (CONTROLS[e.code]) keys[CONTROLS[e.code]] = false;
  if (e.code === 'Space') keys.fire = false;
});

window.addEventListener('blur', function(){
  for (var k in keys) keys[k] = false;
  pointer.down = false;
});

window.addEventListener('pointerdown', function(e){
  Sound.unlock();
  onHumanAct();
  if (state === S.OVER){ restart(); return; }
  pointer.down = true;
  pointer.sx = e.clientX; pointer.sy = e.clientY;
  pointer.cx = e.clientX; pointer.cy = e.clientY;
}, { passive: true });

window.addEventListener('pointermove', function(e){
  pointer.cx = e.clientX; pointer.cy = e.clientY;
});
window.addEventListener('pointerup', function(){ pointer.down = false; });
window.addEventListener('pointercancel', function(){ pointer.down = false; });

function flashMute(){
  showBanner(Sound.muted ? 'MUTED' : 'SOUND ON', '', 1.2);
}

function togglePause(){
  if (state === S.PAUSED){
    state = prevState;
    lastHuman = nowMs();
    Sound.resume();
    showBanner('RESUMED', '', 1.0);
  } else {
    prevState = state;
    state = S.PAUSED;
    Sound.thrust(0);
    showBanner('PAUSED', 'PRESS <b>P</b> TO RESUME', 999);
  }
}

function restart(){
  setState(S.PLAYING);
  resetRun();
  onHumanAct();
  Sound.start();
}

document.addEventListener('visibilitychange', function(){
  if (document.hidden){
    if (state !== S.PAUSED && state !== S.OVER){ prevState = state; state = S.PAUSED; }
    Sound.thrust(0);
    Sound.suspend();
  } else {
    if (state === S.PAUSED){ state = prevState; }
    lastHuman = nowMs();
    lastT = nowMs();
    Sound.resume();
  }
});

/* ---------------------------------------------------------------- ai */
function aiUpdate(dt){
  aiT += dt;
  var out = aiOut;
  out.left = out.right = out.thrust = out.fire = false;
  if (!ship.alive) return out;

  var avx = 0, avy = 0, threat = 0, danger = 0;
  var target = null, tScore = -1e9;

  for (var i = 0; i < asteroids.length; i++){
    var a = asteroids[i];
    var dx = wrapDelta(a.x - ship.x, FIELD_X);
    var dy = wrapDelta(a.y - ship.y, FIELD_Y);
    var d = Math.hypot(dx, dy) || 0.001;
    var rvx = ship.vx - a.vx, rvy = ship.vy - a.vy;
    var rel = Math.hypot(rvx, rvy);
    var closing = -(dx * rvx + dy * rvy) / d;
    var tca = closing > 0 ? (d / rel) : 0;
    var sep = Math.hypot(dx - rvx * tca, dy - rvy * tca);
    var clear = a.r + SHIP_R + 1.4;

    if (closing > 0 && sep < clear + 4.2 && tca < 2.6){
      threat++;
      var w = (1 / (d + 1.2)) * (1 / (0.5 + tca));
      avx += (dx / d) * w;
      avy += (dy / d) * w;
    }
    if (sep < clear + 1.0 && tca < 1.2) danger = Math.max(danger, 1 - sep / (clear + 1.0));

    var s = 16 - d / FIELD_X * 10 + (a.size === 2 ? 1.6 : 0) + (a.size === 0 ? 0.8 : 0);
    if (closing > 0 && sep < clear + 5) s += 7;
    if (s > tScore){ tScore = s; target = a; }
  }

  var fx = Math.sin(ship.head), fy = Math.cos(ship.head);
  var wantHead = ship.head;

  if (threat > 0){
    var al = Math.hypot(avx, avy);
    if (al > 1e-5){ avx /= al; avy /= al; } else { avx = -fx; avy = -fy; }
    var blend = clamp(0.35 + danger * 0.75, 0.35, 1.0);
    wantHead = Math.atan2(avx * blend + fx * (1 - blend), avy * blend + fy * (1 - blend));
  } else if (target){
    var ddx = wrapDelta(target.x - ship.x, FIELD_X);
    var ddy = wrapDelta(target.y - ship.y, FIELD_Y);
    var dd = Math.hypot(ddx, ddy) || 0.001;
    var tt = dd / BULLET_SPEED;
    var pdx = wrapDelta(target.x + target.vx * tt - ship.x, FIELD_X);
    var pdy = wrapDelta(target.y + target.vy * tt - ship.y, FIELD_Y);
    wantHead = Math.atan2(pdx, pdy);
  }

  wantHead += Math.sin(aiT * 0.63) * 0.085 + Math.sin(aiT * 0.23 + 2.1) * 0.055;
  var diff = wrapAngle(wantHead - ship.head);
  if (diff > 0.055) out.right = true;
  else if (diff < -0.055) out.left = true;

  var align = Math.cos(diff);
  var speed = Math.hypot(ship.vx, ship.vy);
  if (threat > 0){
    out.thrust = align > 0.18 && speed < SHIP_MAXV * 1.04;
  } else {
    out.thrust = align > 0.88 && speed < SHIP_MAXV * 0.66;
  }

  if (target){
    var bx = wrapDelta(target.x - ship.x, FIELD_X);
    var by = wrapDelta(target.y - ship.y, FIELD_Y);
    var bd = Math.hypot(bx, by);
    var lead = bd / BULLET_SPEED;
    var px = wrapDelta(target.x + target.vx * lead - ship.x, FIELD_X);
    var py = wrapDelta(target.y + target.vy * lead - ship.y, FIELD_Y);
    var err = Math.abs(wrapAngle(Math.atan2(px, py) - ship.head));
    var aimOk = err < (danger > 0.25 ? 0.30 : 0.085);
    if (aimOk && (threat === 0 || err < 0.22 || danger > 0.4)) out.fire = true;
  }
  return out;
}

/* ---------------------------------------------------------------- update */
var input = { left: false, right: false, thrust: false, reverse: false, fire: false };

function update(dt){
  if (state === S.PAUSED) return;
  var tnow = nowMs();

  if (!autopilot && tnow - lastHuman > IDLE_MS){
    autopilot = true;
    setBadge();
  }

  input = autopilot ? aiUpdate(dt) : humanInput();

  var playing = (state === S.PLAYING || state === S.ATTRACT || state === S.RESPAWN);

  if (bannerT > 0){
    bannerT -= dt;
    if (bannerT <= 0) elBanner.classList.add('hidden');
  }

  ship.cool -= dt;
  ship.turnVis += (0 - ship.turnVis) * Math.min(1, dt * 8);

  if (state === S.RESPAWN){
    respawnT -= dt;
    if (respawnT <= 0){
      respawnShip(false);
      leaveRespawn();
    }
  }

  if (state === S.OVER){
    overT += dt;
    if (overT * 1000 > DEMO_RETURN_MS && tnow - lastHuman > DEMO_RETURN_MS){
      setState(S.ATTRACT);
      autopilot = true;
    }
  }

  if (ship.alive){
    var turn = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    ship.head = wrapAngle(ship.head + turn * SHIP_TURN * dt);
    ship.turnVis += (turn - ship.turnVis) * Math.min(1, dt * 9);

    var acc = 0;
    if (input.thrust) acc += SHIP_ACCEL;
    if (input.reverse) acc -= SHIP_ACCEL * SHIP_REVERSE;
    ship.vx += Math.sin(ship.head) * acc * dt;
    ship.vy += Math.cos(ship.head) * acc * dt;

    var drag = Math.exp(-(input.thrust ? 0.35 : SHIP_DRAG) * dt);
    ship.vx *= drag; ship.vy *= drag;
    var sp = Math.hypot(ship.vx, ship.vy);
    if (sp > SHIP_MAXV){ ship.vx = ship.vx / sp * SHIP_MAXV; ship.vy = ship.vy / sp * SHIP_MAXV; }

    ship.x = wrapPos(ship.x + ship.vx * dt, FIELD_X);
    ship.y = wrapPos(ship.y + ship.vy * dt, FIELD_Y);

    var th = (input.thrust ? 1 : 0) * (0.7 + Math.random() * 0.5);
    ship.thrust += (th - ship.thrust) * Math.min(1, dt * 14);
    if (input.thrust && Math.random() < 0.75){
      var jx = rnd(-0.16, 0.16), jy = rnd(-0.16, 0.16);
      var bfx = -Math.sin(ship.head), bfy = -Math.cos(ship.head);
      spawnPart({
        x: ship.x + bfx * 0.85 + jx, y: ship.y + bfy * 0.85 + jy, z: rnd(-0.2, 0.2),
        vx: bfx * rnd(7, 15) + ship.vx * 0.25 + jx * 12,
        vy: bfy * rnd(7, 15) + ship.vy * 0.25 + jy * 12,
        vz: rnd(-0.8, 0.8),
        life: rnd(0.18, 0.42), size: rnd(0.24, 0.5),
        r: Math.random() < 0.3 ? 1 : 0.44, g: Math.random() < 0.3 ? 0.72 : 0.94, b: 1,
        drag: 2.6
      });
    }
    if (input.fire && ship.cool <= 0 && ship.invuln <= 0.05) spawnBullet();

    if (ship.invuln > 0) ship.invuln -= dt;
  }

  for (var i = 0; i < asteroids.length; i++){
    var a = asteroids[i];
    a.x = wrapPos(a.x + a.vx * dt, FIELD_X);
    a.y = wrapPos(a.y + a.vy * dt, FIELD_Y);
    a.mesh.position.x = a.x;
    a.mesh.position.y = a.y;
    a.mesh.rotation.x += a.rx * a.spin * dt;
    a.mesh.rotation.y += a.ry * a.spin * dt;
    a.mesh.rotation.z += a.rz * a.spin * dt;
  }

  for (var b = 0; b < bullets.length; b++){
    var bl = bullets[b];
    if (!bl.on) continue;
    bl.life -= dt;
    if (bl.life <= 0){
      bl.on = false; bl.mesh.visible = false;
      burst(bl.x, bl.y, 4, 0x6ff6ff, 0xffffff, 3, 0.25, 0.3, 0.2);
      continue;
    }
    bl.x = wrapPos(bl.x + bl.vx * dt, FIELD_X);
    bl.y = wrapPos(bl.y + bl.vy * dt, FIELD_Y);
    bl.mesh.position.set(bl.x, bl.y, 0);
    bl.mesh.rotation.z = ship.head;
    bl.trail -= dt;
    if (bl.trail <= 0){
      bl.trail = 0.022;
      spawnPart({
        x: bl.x, y: bl.y, z: rnd(-0.12, 0.12),
        vx: -bl.vx * 0.06 + rnd(-0.7, 0.7), vy: -bl.vy * 0.06 + rnd(-0.7, 0.7), vz: rnd(-0.3, 0.3),
        life: rnd(0.16, 0.3), size: rnd(0.2, 0.4), r: 0.6, g: 0.95, b: 1, drag: 3.2
      });
    }
  }

  for (var bi = 0; bi < bullets.length; bi++){
    var ub = bullets[bi];
    if (!ub.on) continue;
    for (var ai = asteroids.length - 1; ai >= 0; ai--){
      var aa = asteroids[ai];
      var rr = (aa.r + 0.18) * (aa.r + 0.18);
      if (dist2(ub.x, ub.y, aa.x, aa.y, FIELD_X, FIELD_Y) < rr){
        ub.on = false; ub.mesh.visible = false;
        hitAsteroid(aa, true);
        break;
      }
    }
  }

  if (ship.alive && ship.invuln <= 0){
    for (var ci = asteroids.length - 1; ci >= 0; ci--){
      var ca = asteroids[ci];
      var cr = (ca.r + SHIP_R * 0.82);
      if (dist2(ship.x, ship.y, ca.x, ca.y, FIELD_X, FIELD_Y) < cr * cr){
        hitAsteroid(ca, false);
        killShip();
        break;
      }
    }
  }

  if (playing && asteroids.length === 0 && state !== S.OVER){
    waveTimer += dt;
    if (waveTimer > 1.1){
      waveTimer = 0;
      spawnWave(wave + 1);
      showBanner('WAVE ' + wave, 'THREATS INBOUND', 1.8);
      Sound.pickup();
    }
  } else {
    waveTimer = 0;
  }

  updateParticles(dt);
  updateRings(dt);

  shipMesh.visible = ship.alive;
  shipMesh.position.set(ship.x, ship.y, 0);
  shipMesh.rotation.y = ship.head;
  shipMesh.rotation.z = -ship.turnVis * 0.55;
  shipMesh.rotation.x = clamp(-ship.vy * 0.006, -0.22, 0.22);
  var ud = shipMesh.userData;
  ud.flame.visible = ship.alive && ship.thrust > 0.06;
  if (ud.flame.visible){
    ud.flame.scale.set(0.85 + Math.random() * 0.3, 0.85 + Math.random() * 0.3, 0.5 + ship.thrust * 1.15 + Math.random() * 0.22);
    ud.flame.material.opacity = 0.45 + ship.thrust * 0.5;
  }
  ud.glow.scale.setScalar(0.8 + ship.thrust * 0.5);
  ud.glow.material.opacity = 0.25 + ship.thrust * 0.4;
  ud.shield.visible = ship.alive && ship.invuln > 0;
  ud.shield.material.uniforms.uTime.value = aiT;
  ud.shield.material.uniforms.uAlpha.value = ship.alive ? clamp(ship.invuln, 0, 1) : 0;

  Sound.thrust(ship.alive ? ship.thrust : 0);

  for (var si = 0; si < stars.length; si++){
    var sp2 = stars[si];
    var pos = sp2.pts.geometry.attributes.position;
    var arr = pos.array, k;
    for (k = 0; k < arr.length; k += 3) arr[k + 2] += sp2.speed * dt;
    for (k = 0; k < arr.length; k += 3){
      if (arr[k + 2] > 40) arr[k + 2] -= sp2.spread;
    }
    pos.needsUpdate = true;
  }

  if (shake > 0.001){
    shake = Math.max(0, shake - dt * 2.4);
    camera.position.set(rnd(-1, 1) * shake * 0.55, FIELD_Y * 0.62 + rnd(-1, 1) * shake * 0.55, baseCamZ);
  } else {
    camera.position.set(0, FIELD_Y * 0.62, baseCamZ);
  }
  camera.lookAt(0, 0, 0);
}

/* ---------------------------------------------------------------- loop */
var lastT = nowMs();
var acc = 0;

function frame(t){
  requestAnimationFrame(frame);
  var dt = (t - lastT) / 1000;
  lastT = t;
  if (!(dt > 0)) dt = STEP;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  var steps = 0;
  while (acc >= STEP && steps < 8){ update(STEP); acc -= STEP; steps++; }
  if (steps >= 8) acc = 0;
  renderer.render(scene, camera);
}

window.addEventListener('resize', function(){
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  fitCamera();
});

fitCamera();
setState(S.ATTRACT);
elBest.textContent = best;
Sound.unlock();
if (!Sound.ready) elSound.classList.remove('hidden');
requestAnimationFrame(frame);

};
</script>
